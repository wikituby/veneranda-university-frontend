<div class="container-fluid py-4 settings-page">
  <h4 class="fw-bold mb-1">Settings</h4>
  <p class="text-muted mb-4">Layout preferences for this browser.</p>

  <section class="settings-section">
    <h6 class="settings-section-title">Sidebar</h6>
    <label class="settings-row">
      <div class="settings-row-copy">
        <div class="settings-row-title">Icons only</div>
        <p class="settings-row-desc">
          Collapse the sidebar to a column of icons. Hover to expand it over the page; it folds away after you
          choose an item or move the pointer off.
        </p>
      </div>
      <div class="form-check form-switch settings-switch">
        <input
          class="form-check-input"
          type="checkbox"
          role="switch"
          [checked]="hoverSidebar()"
          (change)="onHoverSidebarChange($event)"
          aria-label="Icons only sidebar"
        />
      </div>
    </label>
  </section>
</div>
