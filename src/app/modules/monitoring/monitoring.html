<div class="container-fluid py-4">
  @if (showToast()) { <div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999"><div class="toast show align-items-center text-bg-{{ toastType() }} border-0"><div class="d-flex"><div class="toast-body">{{ toastMessage() }}</div><button class="btn-close btn-close-white me-2 m-auto" (click)="showToast.set(false)"></button></div></div></div> }
  <div class="d-flex justify-content-between align-items-center mb-4"><div><h4 class="fw-bold mb-1">Network Monitoring</h4><p class="text-muted small mb-0">Monitor network devices and health</p></div><button class="btn btn-primary" (click)="openAdd()"><i class="bi bi-graph-up me-1"></i> Add Monitor</button></div>
  <div class="card border-0 shadow-sm"><div class="card-body text-center py-5"><div class="mb-3"><div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light" style="width:80px;height:80px"><i class="bi bi-heart-pulse text-muted display-6"></i></div></div><h5 class="fw-bold">Network Monitoring</h5><p class="text-muted">Module ready for backend implementation.</p><button class="btn btn-primary" (click)="openAdd()"><i class="bi bi-plus-circle me-1"></i> Add First Monitor</button></div></div>
  @if (showModal()) { <div class="modal-backdrop fade show"></div><div class="modal fade show d-block" tabindex="-1" style="z-index:1055"><div class="modal-dialog modal-dialog-centered"><div class="modal-content border-0 shadow-lg" style="border-radius:16px"><div class="modal-header border-0 px-4 pt-4"><h5 class="modal-title fw-bold">{{ modalTitle() }}</h5><button class="btn-close" (click)="showModal.set(false)"></button></div><div class="modal-body px-4"><div class="mb-3"><label class="form-label fw-semibold">Device Name</label><input class="form-control" placeholder="e.g. Core Router"></div><div class="mb-3"><label class="form-label fw-semibold">IP Address</label><input class="form-control" placeholder="192.168.1.1"></div></div><div class="modal-footer border-0 px-4 pb-4"><button class="btn btn-outline-secondary" (click)="showModal.set(false)">Cancel</button><button class="btn btn-primary" (click)="save()">Add</button></div></div></div></div> }
</div>
