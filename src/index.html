<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Veneranda University</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Enterprise ISP Management System - Hotspot, PPPoE, Billing, CRM" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
  />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    (function () {
      try {
        var appearance = localStorage.getItem('isp_appearance');
        if (!appearance) {
          var legacy = localStorage.getItem('isp_theme');
          appearance = legacy === 'dark' ? 'dark' : legacy === 'light' ? 'light' : 'split';
        }
        if (appearance !== 'split' && appearance !== 'dark' && appearance !== 'light') {
          appearance = 'split';
        }
        document.documentElement.classList.add('appearance-' + appearance);
        if (appearance === 'dark') {
          document.documentElement.classList.add('dark-mode');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <script>
    (function () {
      try {
        var redirect = sessionStorage.getItem('gh-pages-redirect');
        if (redirect) {
          sessionStorage.removeItem('gh-pages-redirect');
          history.replaceState(null, '', redirect);
        }
      } catch (_) {}
    })();
  </script>
  <script>
    (function () {
      try {
        var appearance = localStorage.getItem('isp_appearance');
        if (!appearance) {
          var legacy = localStorage.getItem('isp_theme');
          appearance = legacy === 'dark' ? 'dark' : legacy === 'light' ? 'light' : 'split';
        }
        if (appearance !== 'split' && appearance !== 'dark' && appearance !== 'light') {
          appearance = 'split';
        }
        document.body.classList.add('appearance-' + appearance);
        if (appearance === 'dark') {
          document.body.classList.add('dark-mode');
        }
      } catch (_) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
